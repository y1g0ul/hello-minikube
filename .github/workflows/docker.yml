name: Docker CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "k8s/**"

  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "k8s/**"

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.changes.outputs.image_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether the image needs rebuilding
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          image_changed=true
          comparison_base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            comparison_base="$PR_BASE"
          fi

          if [[ "$EVENT_REF" != refs/tags/* ]] && \
             git cat-file -e "${comparison_base}^{commit}" 2>/dev/null; then
            if git diff --quiet "$comparison_base" HEAD -- \
              app.py requirements.txt Dockerfile .dockerignore .github/workflows/docker.yml; then
              image_changed=false
            fi
          fi

          echo "image_changed=$image_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.image_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.changes.outputs.image_changed == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        if: steps.changes.outputs.image_changed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: y1g0ul/hello-minikube
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag

      - name: Build and push Docker image
        if: steps.changes.outputs.image_changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - linux
      - x64
      - minikube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Apply manifests with the deployment image
        shell: bash
        env:
          IMAGE_CHANGED: ${{ needs.docker.outputs.image_changed }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$IMAGE_CHANGED" == "true" ]]; then
            deploy_image="y1g0ul/hello-minikube:sha-${COMMIT_SHA}"
          else
            deploy_image=$(kubectl get deployment hello-minikube --ignore-not-found \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="hello-minikube")].image}')
          fi

          kubectl apply -f k8s/service.yaml
          if [[ -n "$deploy_image" ]]; then
            kubectl set image --local -f k8s/deployment.yaml \
              "hello-minikube=$deploy_image" -o yaml | kubectl apply -f -
          else
            kubectl apply -f k8s/deployment.yaml
          fi

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hello-minikube --timeout=120s

      - name: Show deployment state
        run: |
          kubectl get deployment hello-minikube
          kubectl get pods -o wide
