name: Docker CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: y1g0ul/hello-minikube
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - linux
      - x64
      - minikube

    steps:
      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes
          kubectl get deployment hello-minikube

      - name: Deploy new image
        run: |
          kubectl set image deployment/hello-minikube \
            hello-minikube=y1g0ul/hello-minikube:sha-${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/hello-minikube --timeout=120s

      - name: Show deployment state
        run: |
          kubectl get deployment hello-minikube
          kubectl get pods -o wide